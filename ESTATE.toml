version = 3
template = "estate-repository-v3"

[repo]
id = "lean-goose"
slug = "larsbx/lean-goose"
class = "research"
layer = 3
band = "EXPLORE"
stage = "candidate"
inv = []
default_branch = "main"

[origin]
decided_by = "proposed"
chats = []
artifacts = []

[[dep]]
id = "estate-governance"
rev = "b851c92fceb88c8e6f4604664cf975b567ade161"
pin = "sha256:c931b9e20388148aa706a2da0ebd78a02a69a707ae5bc60518344cdf10674cb0"

[[dep]]
id = "lean-ocaml"
rev = "403dcca50d7e8f18954618eec72109f8cb1c6b61"
pin = "sha256:826077e1a13594191e7c64979a766bd5e39c83604d40698b3d6270631edc5455"

[[dep]]
id = "goose"
rev = "9412b80f52d833c4697cffdbbf1f4eeb5195cd41"
pin = "sha256:f1597f2e63290612653b116b2ef703fa4add4c08f32180bb2d2e98b7844ba427"

[exports]
names = []

[layout]
status = "canonical"

[principles]
ordering = ["authority", "domain"]
empty_silos = "forbidden"
disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

[[plane]]
id = "policy"
target = "policy"
authority = "governance"
required = true
current = ["policy", "ESTATE.toml"]

[[plane]]
id = "reference"
target = "reference"
authority = "non_authoritative_reference"
required = true
current = ["reference"]

[[plane]]
id = "oracles"
target = "oracles"
authority = "non_authoritative_oracle"
required = true
current = ["oracles"]

[[plane]]
id = "schemas"
target = "schemas"
authority = "contract"
required = true
current = ["schemas"]

[[plane]]
id = "conformance"
target = "conformance"
authority = "evidence"
required = true
current = ["conformance"]

[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "ARCHITECTURE.md", "LANGUAGE_BOUNDARIES.md", "README.md", "AGENTS.md"]

[[plane]]
id = "formal"
target = "formal"
authority = "claim_state"
required = true
current = ["formal"]

[[plane]]
id = "formal-tests"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

[authority]
acceptance_authority = false

[formalization]
scope = "docs/formalization.md"
gate = "tools/check_formal.py"
implementation_paths = [
  "formal/quint/replay.py",
  "reference/checker.goose",
  "tools/acceptance.py",
  "tools/check_formal.py",
  "tools/run.py",
  "tools/runtime.py",
  "tools/transaction_profile.py",
]

[formalization.lean]
sources = ["formal/lean/DefinitionTransactions.lean", "formal/lean/Audit.lean", "formal/lean/Replay.lean"]
toolchain = "leanprover/lean4:v4.34.1"
obligations = [
  "GooseTransactions.completed_receipt_has_no_authority",
  "GooseTransactions.duplicate_precedes_checks",
  "GooseTransactions.duplicate_preserves_environment",
  "GooseTransactions.fresh_good_appends",
  "GooseTransactions.fresh_scope_halts",
  "GooseTransactions.halted_no_receipt",
  "GooseTransactions.halted_run_identity",
  "GooseTransactions.halted_step_identity",
  "GooseTransactions.initial_invariant",
  "GooseTransactions.mismatch_preserves_environment",
  "GooseTransactions.mismatch_then_retry_succeeds",
  "GooseTransactions.missing_alias_preserves_environment",
  "GooseTransactions.run_environment_exact",
  "GooseTransactions.run_environment_extends",
  "GooseTransactions.run_environment_unique",
  "GooseTransactions.run_has_no_authority",
  "GooseTransactions.run_preserves_authority",
  "GooseTransactions.run_preserves_invariant",
  "GooseTransactions.run_success_count_exact",
  "GooseTransactions.step_preserves_authority",
  "GooseTransactions.step_preserves_invariant",
]

[formalization.quint]
sources = ["formal/quint/DefinitionTransactions.qnt"]
toolchain = "@informalsystems/quint@0.33.1"
obligations = [
  "authorityPreservedTest",
  "duplicatePreemptsScopeTest",
  "duplicatePreservesEnvironmentTest",
  "failedInsertionRetryTest",
  "haltAbsorbingTest",
  "initialStateTest",
  "orderedSuccessCountTest",
  "safety",
  "scopeFailureSuppressesReceiptTest",
  "successfulDefinitionTest",
  "unknownAliasPreservesExistingTest",
  "unknownAliasRecoveryTest",
  "validAliasTest",
]

[migration]
mode = "boundary_first"
mass_move = false
next = []
