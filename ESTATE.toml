[exports]
names = []

[layout]
status = "canonical"

[principles]
ordering = ["authority", "domain"]
empty_silos = "forbidden"
disagreement = "fail_closed"
generated_surfaces = "derived_only"
vendor_code = "non_local"
experimental_code = "non_authoritative"

[[plane]]
id = "policy"
target = "policy"
authority = "governance"
required = true
current = ["policy", "ESTATE.toml"]

[[plane]]
id = "reference"
target = "reference"
authority = "non_authoritative_reference"
required = true
current = ["reference"]

[[plane]]
id = "oracles"
target = "oracles"
authority = "non_authoritative_oracle"
required = true
current = ["oracles"]

[[plane]]
id = "schemas"
target = "schemas"
authority = "contract"
required = true
current = ["schemas"]

[[plane]]
id = "conformance"
target = "conformance"
authority = "evidence"
required = true
current = ["conformance"]

[[plane]]
id = "tooling"
target = "tools"
authority = "repository_tooling"
required = true
current = ["tools"]

[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "ARCHITECTURE.md", "LANGUAGE_BOUNDARIES.md", "README.md", "AGENTS.md"]

[[plane]]
id = "formal"
target = "formal"
authority = "claim_state"
required = true
current = ["formal"]

[[plane]]
id = "formal-tests"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

[authority]
acceptance_authority = false

[formalization]
scope = "docs/formalization.md"
