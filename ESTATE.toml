[[plane]]
id = "docs"
target = "docs"
authority = "exposition"
required = true
current = ["docs", "ARCHITECTURE.md", "LANGUAGE_BOUNDARIES.md", "README.md", "AGENTS.md"]

[[plane]]
id = "formal"
target = "formal"
authority = "claim_state"
required = true
current = ["formal"]

[[plane]]
id = "formal-tests"
target = "tests"
authority = "evidence"
required = true
current = ["tests"]

[authority]
